name: Validate PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited

jobs:
  validate-pr-title:
    if: github.event.pull_request.draft == false && github.head_ref != 'release-please-*'
    runs-on: [ubuntu-latest]
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            repo
            main
            deps
            deps-dev
            rpc
            chainspec
            reth
            consensus
            block
            evm
            network
            payload
            db
            docker
            security
          requireScope: true
          subjectPattern: ^(?![A-Z])(?!.*\btypo\b).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Ensure the subject starts with
            a lowercase letter and does not contain the word "typo".
